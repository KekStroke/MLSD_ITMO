name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.9.25
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Check all tracked files
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - name: Verify Python syntax
        run: uv run --locked python -m compileall -q src
